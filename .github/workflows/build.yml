name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        run: cmake -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: LitePainter-windows
          path: build/Release/LitePainter.exe
